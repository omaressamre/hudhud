name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l helper)" || { gofmt -l helper; exit 1; }
      - name: Quick suite (locales, syntax, unit, go vet)
        run: tests/run-all.sh
      - name: Build release zips (smoke)
        run: scripts/build.sh --no-fonts
