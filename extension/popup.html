<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Hudhud</title>
  <link rel="stylesheet" href="ui/theme.css">
  <link rel="stylesheet" href="ui/popup.css">
</head>
<body>
  <div class="popup">
    <header class="head">
      <div class="logo">
        <img class="light-only" src="assets/icon.svg" alt="" width="34" height="34">
        <img class="dark-only" src="assets/icon-dark.svg" alt="" width="34" height="34">
        <span class="brand" data-i18n="brand">هدهد</span>
      </div>
      <button class="icon-btn" id="btnSettings" data-i18n-title="settings"></button>
    </header>
    <section id="banners"></section>
    <section id="outcome"></section>
    <div id="status" class="status" hidden><i></i><span></span></div>
    <section id="pageCard"></section>
    <section id="items" class="list"></section>
    <section id="empty"></section>
    <section id="jobsWrap" hidden>
      <div class="label" data-i18n="downloads">التحميلات</div>
      <div id="jobs" class="list"></div>
    </section>
    <footer class="foot">
      <a href="#" id="btnSupport" class="support"><span data-i18n="support">ادعم هدهد</span></a>
      <span id="ver" class="mono muted"></span>
    </footer>
  </div>
  <div id="menu" class="menu" hidden></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
